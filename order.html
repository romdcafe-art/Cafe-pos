<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Order — Coffee POS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="order-main">
    <div class="order-header">
      <div class="seat-title" id="order-title">—</div>
      <a href="index.html">← Back to POS</a>
    </div>

    <div class="order-layout">
      <!-- LEFT: Menu -->
      <div>
        <div class="category-tabs" id="category-tabs"></div>
        <div class="menu-grid" id="menu-grid"></div>
      </div>

      <!-- RIGHT: Current Order -->
      <div class="order-panel">
        <div class="order-panel-title">Current Order</div>
        <div id="cart-lines"></div>

        <div class="order-totals">
          <div class="order-totals-row">
            <span>Subtotal</span>
            <span id="subtotal-value">฿0</span>
          </div>
          <div class="order-totals-row">
            <span>Discount</span>
            <input type="number" class="discount-input" id="discount-input" value="0" min="0">
          </div>
          <div class="order-totals-row grand">
            <span>TOTAL</span>
            <span id="total-value">฿0</span>
          </div>
        </div>

        <div class="order-panel-actions">
          <button class="btn-secondary" id="btn-save-order">Save Order</button>
          <button class="btn-primary" id="btn-payment">PAYMENT</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Receipt success screen (แสดงหลัง Confirm Payment) -->
  <div id="receipt-success-screen" style="display:none;">
    <div class="screen" style="text-align:center; max-width:420px;">
      <div style="font-size:60px; margin-bottom:10px;">✅</div>
      <div style="font-size:22px; font-weight:700; color:var(--green-900); margin-bottom:6px;">Payment Successful</div>
      <div style="color:var(--ink-soft); margin-bottom:26px;">ใบเสร็จถูกส่งไปพิมพ์แล้ว</div>
      <div class="order-panel-actions">
        <button class="btn-secondary" id="btn-print-again">PRINT AGAIN</button>
        <button class="btn-primary" id="btn-back-to-pos">กลับหน้า POS</button>
      </div>
    </div>
  </div>

  <!-- Payment Modal -->
  <div class="modal-overlay" id="payment-modal-overlay">
    <div class="modal-box">
      <div class="modal-title">Payment</div>
      <div class="payment-total" id="payment-total-value">฿0</div>

      <div class="payment-methods">
        <button class="payment-method-btn" data-method="CASH">CASH</button>
        <button class="payment-method-btn" data-method="TRANSFER/QR">TRANSFER / QR</button>
        <button class="payment-method-btn" data-method="CARD">CARD</button>
      </div>

      <div id="cash-fields" style="display:none;">
        <div class="form-group">
          <label>Amount Received</label>
          <input type="number" id="cash-received-input" min="0" placeholder="0">
        </div>
        <div class="change-display" id="change-display"></div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="btn-cancel-payment">ยกเลิก</button>
        <button type="button" class="btn-primary" id="btn-confirm-payment">CONFIRM PAYMENT</button>
      </div>
    </div>
  </div>

  <!-- Printable receipt (ซ่อนอยู่ปกติ แสดงเฉพาะตอนสั่งพิมพ์ — ดู @media print ใน style.css) -->
  <div id="receipt-print-area"></div>

  <div class="toast" id="toast"></div>

  <script src="cache.js"></script>
  <script src="api.js"></script>
  <script src="order.js"></script>
</body>
</html>
